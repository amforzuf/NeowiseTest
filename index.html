<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    button:disabled { cursor: wait; }
    textarea[aria-invalid="true"] { border: 2px solid #b42318; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4" aria-describedby="status"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
  <section id="result" hidden aria-labelledby="result-title">
    <h2 id="result-title">Результат разбора</h2>
    <p>Тема: <strong id="topic"></strong></p>
    <h3>Черновик ответа</h3>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const button = document.querySelector("button");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topics = { delivery: "Доставка", pricing: "Стоимость", other: "Другое" };
    const manualReview = "Не удалось подготовить черновик. Разберите заявку вручную и составьте ответ клиенту. Текст заявки сохранён.";

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (button.disabled) return;

      result.hidden = true;
      topic.textContent = "";
      draft.textContent = "";
      message.removeAttribute("aria-invalid");
      const text = message.value.trim();
      if (!text) {
        status.textContent = "Введите текст заявки.";
        message.setAttribute("aria-invalid", "true");
        message.focus();
        return;
      }

      button.disabled = true;
      message.disabled = true;
      form.setAttribute("aria-busy", "true");
      status.textContent = "Разбираем заявку…";
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 5_000);

      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: controller.signal,
        });
        const data = await reply.json();
        if (reply.status === 400 && data?.status === "invalid_input") {
          status.textContent = "Введите непустой текст заявки и повторите разбор.";
          message.setAttribute("aria-invalid", "true");
        } else if (
          reply.ok &&
          data?.status === "ready" &&
          Object.hasOwn(topics, data.topic) &&
          typeof data.draft === "string" &&
          data.draft.trim()
        ) {
          topic.textContent = topics[data.topic];
          draft.textContent = data.draft;
          result.hidden = false;
          status.textContent = "Черновик готов. Проверьте его перед отправкой клиенту.";
        } else {
          status.textContent = manualReview;
        }
      } catch {
        status.textContent = manualReview;
      } finally {
        clearTimeout(timer);
        button.disabled = false;
        message.disabled = false;
        form.removeAttribute("aria-busy");
      }
    });
  </script>
</body>
</html>
